name: Build Windows 10 app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtbase"
          setup-python: "false"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt
        run: windeployqt --release --compiler-runtime build/Release/ClientOrders.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/* package/ -Recurse -Force
          Compress-Archive -Path package/* -DestinationPath ClientOrders-Windows10-x64.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ClientOrders-Windows10-x64
          path: ClientOrders-Windows10-x64.zip
