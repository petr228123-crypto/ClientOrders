name: Build Windows 10 app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtbase"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          $exe = "build/Release/ClientOrders.exe"
          windeployqt --release --compiler-runtime $exe
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $exe package/
          Get-ChildItem build/Release -Directory | ForEach-Object {
            Copy-Item $_.FullName package/ -Recurse -Force
          }
          Get-ChildItem build/Release -File -Filter "*.dll" | Copy-Item -Destination package/ -Force
          Copy-Item README.md package/

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath ClientOrders-Windows10-x64.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ClientOrders-Windows10-x64
          path: ClientOrders-Windows10-x64.zip
